spring:
  application:
    name: skala-shop-api
  datasource:
    url: jdbc:h2:mem:skalashop
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # 32바이트 이상 키를 Base64로 인코딩한 개발용 예시 값
  secret: U0tBTEEtU0hPUC1KV1QtU0VDUkVULUtFWS0yMDI2LTA4LTA3ISE=
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
